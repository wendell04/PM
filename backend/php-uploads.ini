; The php base image ships php.ini-development and php.ini-production but activates neither, so PHP
; falls back to its compiled-in defaults - upload_max_filesize 2M. Every upload in the app sat under
; that ceiling silently: PHP discards an oversized file before Laravel runs, so the max:10240 rule
; never got to speak and the customer was told to "try again" on a file that could never succeed.
;
; 12M is deliberately above the app's own 10 MB limit so Laravel is the gate that refuses, because
; that is the only one of the two that can explain itself.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
